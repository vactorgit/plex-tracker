<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex Tracker - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            width: 90%;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .plex-logo {
            width: 80px;
            height: 80px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 20px;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .divider {
            text-align: center;
            margin: 25px 0 20px;
            color: #999;
            font-size: 12px;
        }

        .plex-section {
            border-top: 1px solid #e0e6ed;
            padding-top: 20px;
        }

        .plex-section h3 {
            color: #667eea;
            font-size: 14px;
            margin-bottom: 15px;
        }

        input[type="text"],
        input[type="password"] {
            padding: 12px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            margin-bottom: 10px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .sync-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .sync-btn:hover {
            background: #764ba2;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .sync-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .user-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: white;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        button:hover {
            background: #667eea;
            color: white;
        }

        button[type="submit"] {
            margin-top: 30px;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-size: 16px;
        }

        button[type="submit"]:hover {
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        input[type="hidden"] {
            display: none;
        }

        .selected {
            background: #667eea !important;
            color: white !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <svg class="plex-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="15" fill="#222B3E"/>
                <g fill="#00B4D8" transform="translate(25, 35)">
                    <rect x="0" y="0" width="8" height="30"/>
                    <rect x="12" y="5" width="8" height="25"/>
                    <rect x="24" y="0" width="8" height="30"/>
                </g>
            </svg>
        </div>
        <h1>Plex Tracker</h1>
        <p class="subtitle">Track who's watched what</p>

        <form method="POST">
            <label for="user">Select your name:</label>
            <div class="user-buttons">
                {% for u in users %}
                <button type="button" onclick="selectUser('{{ u }}')">{{ u }}</button>
                {% endfor %}
            </div>
            <input type="hidden" id="user" name="user" value="">
            <button type="submit" id="submit-btn" disabled>Continue</button>
        </form>

        <div class="divider">or sync your Plex library</div>

        <div class="plex-section">
            <h3>📺 Sync Plex Library</h3>
            <input type="text" id="plex-username" placeholder="Plex username" autocomplete="username">
            <input type="password" id="plex-password" placeholder="Plex password" autocomplete="password">
            <button class="sync-btn" onclick="syncPlex()">Sync Plex Library</button>
            <div class="status-message" id="sync-status"></div>
        </div>
    </div>

    <script>
        function selectUser(username) {
            document.getElementById('user').value = username;
            const buttons = document.querySelectorAll('.user-buttons button');
            buttons.forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
            document.getElementById('submit-btn').disabled = false;
        }

        async function syncPlex() {
            const username = document.getElementById('plex-username').value;
            const password = document.getElementById('plex-password').value;
            const statusDiv = document.getElementById('sync-status');
            const syncBtn = document.querySelector('.sync-btn');

            if (!username || !password) {
                statusDiv.textContent = 'Please enter your Plex credentials';
                statusDiv.className = 'status-message error';
                return;
            }

            syncBtn.disabled = true;
            statusDiv.textContent = 'Syncing your library...';
            statusDiv.className = 'status-message';

            try {
                const response = await fetch('/api/plex-sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        plex_username: username,
                        plex_password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.textContent = `✓ Synced ${data.added} items from your Plex library!`;
                    statusDiv.className = 'status-message success';
                    setTimeout(() => {
                        document.getElementById('plex-username').value = '';
                        document.getElementById('plex-password').value = '';
                    }, 2000);
                } else {
                    statusDiv.textContent = data.error || 'Sync failed';
                    statusDiv.className = 'status-message error';
                }
            } catch (error) {
                statusDiv.textContent = 'Error connecting to Plex. Check your credentials.';
                statusDiv.className = 'status-message error';
            }

            syncBtn.disabled = false;
        }
    </script>
</body>
</html>

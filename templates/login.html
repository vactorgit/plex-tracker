<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex Tracker - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            width: 90%;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .plex-logo {
            width: 80px;
            height: 80px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 20px;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .user-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: white;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        button:hover {
            background: #667eea;
            color: white;
        }

        button[type="submit"] {
            margin-top: 30px;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-size: 16px;
        }

        button[type="submit"]:hover {
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        input[type="hidden"] {
            display: none;
        }

        .selected {
            background: #667eea !important;
            color: white !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <svg class="plex-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="15" fill="#222B3E"/>
                <g fill="#00B4D8" transform="translate(25, 35)">
                    <rect x="0" y="0" width="8" height="30"/>
                    <rect x="12" y="5" width="8" height="25"/>
                    <rect x="24" y="0" width="8" height="30"/>
                </g>
            </svg>
        </div>
        <h1>Plex Tracker</h1>
        <p class="subtitle">Track who's watched what</p>

        <form method="POST">
            <label for="user">Select your name:</label>
            <div class="user-buttons">
                {% for u in users %}
                <button type="button" onclick="selectUser('{{ u }}')">{{ u }}</button>
                {% endfor %}
            </div>
            <input type="hidden" id="user" name="user" value="">
            <button type="submit" id="submit-btn" disabled>Continue</button>
        </form>
    </div>

    <script>
        function selectUser(username) {
            document.getElementById('user').value = username;
            const buttons = document.querySelectorAll('.user-buttons button');
            buttons.forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
            document.getElementById('submit-btn').disabled = false;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex Tracker - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #14171A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #1F2326;
            border-radius: 20px;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5);
            padding: 60px 50px;
            max-width: 480px;
            width: 100%;
        }

        .logo-wrapper {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #E5A00D 0%, #C4870B 100%);
            border-radius: 22px;
            margin-bottom: 25px;
            box-shadow: 0 15px 40px rgba(229, 160, 13, 0.3);
        }

        .logo-box svg {
            width: 70px;
            height: 70px;
            filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.2));
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #F5F5F5;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .subtitle {
            text-align: center;
            color: #9BA1A6;
            margin-bottom: 40px;
            font-size: 15px;
            font-weight: 500;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 14px;
            color: #F5F5F5;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 35px;
        }

        button {
            padding: 14px 12px;
            border: 2.5px solid #E5A00D;
            border-radius: 12px;
            background: transparent;
            color: #E5A00D;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        button:hover {
            background: #E5A00D;
            color: #1F2326;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(229, 160, 13, 0.3);
        }

        button[type="submit"] {
            margin-top: 0;
            padding: 16px;
            background: linear-gradient(135deg, #E5A00D 0%, #C4870B 100%);
            color: #1F2326;
            border: none;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button[type="submit"]:hover {
            box-shadow: 0 15px 40px rgba(229, 160, 13, 0.4);
            transform: translateY(-3px);
        }

        button[type="submit"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input[type="hidden"] {
            display: none;
        }

        .selected {
            background: #E5A00D !important;
            color: #1F2326 !important;
            box-shadow: 0 10px 25px rgba(229, 160, 13, 0.3);
        }

        .divider {
            text-align: center;
            margin: 45px 0 35px;
            color: #7A8085;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
        }

        .divider:before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1.5px;
            background: #33383C;
            z-index: 0;
        }

        .divider span {
            background: #1F2326;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .plex-section {
            padding: 0;
        }

        .plex-section h3 {
            color: #E5A00D;
            font-size: 12px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        input[type="text"],
        input[type="password"] {
            padding: 13px 16px;
            border: 2px solid #33383C;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            margin-bottom: 12px;
            background: #2A2F33;
            color: #F5F5F5;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #E5A00D;
            background: #2A2F33;
            box-shadow: 0 0 0 4px rgba(229, 160, 13, 0.1);
        }

        .sync-btn {
            background: linear-gradient(135deg, #E5A00D 0%, #C4870B 100%);
            color: #1F2326;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sync-btn:hover {
            box-shadow: 0 15px 40px rgba(229, 160, 13, 0.4);
            transform: translateY(-3px);
        }

        .sync-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 12px;
            padding: 13px 15px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            font-weight: 600;
        }

        .status-message.success {
            background: #1B3326;
            color: #7EE2A8;
            display: block;
        }

        .status-message.error {
            background: #3A1F22;
            color: #FF9AA2;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrapper">
            <div class="logo-box">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Plex">
                    <path d="M38 24 L64 50 L38 76" fill="none" stroke="#1F2326"
                          stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1>Plex Tracker</h1>
            <p class="subtitle">Track who's watched what</p>
        </div>

        <form method="POST">
            <label for="user">Select your name</label>
            <div class="user-buttons">
                {% for u in users %}
                <button type="button" onclick="selectUser('{{ u }}')">{{ u }}</button>
                {% endfor %}
            </div>
            <input type="hidden" id="user" name="user" value="">
            <button type="submit" id="submit-btn" disabled>Continue</button>
        </form>

        <div class="divider"><span>or sync your plex library</span></div>

        <div class="plex-section">
            <h3>📺 Sync Plex Library</h3>
            <input type="text" id="plex-username" placeholder="Plex username" autocomplete="username">
            <input type="password" id="plex-password" placeholder="Plex password" autocomplete="password">
            <button class="sync-btn" onclick="syncPlex()">Sync Plex Library</button>
            <div class="status-message" id="sync-status"></div>
        </div>
    </div>

    <script>
        function selectUser(username) {
            document.getElementById('user').value = username;
            const buttons = document.querySelectorAll('.user-buttons button');
            buttons.forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
            document.getElementById('submit-btn').disabled = false;
        }

        async function syncPlex() {
            const username = document.getElementById('plex-username').value;
            const password = document.getElementById('plex-password').value;
            const statusDiv = document.getElementById('sync-status');
            const syncBtn = document.querySelector('.sync-btn');

            if (!username || !password) {
                statusDiv.textContent = 'Please enter your Plex credentials';
                statusDiv.className = 'status-message error';
                return;
            }

            syncBtn.disabled = true;
            statusDiv.textContent = 'Syncing your library...';
            statusDiv.className = 'status-message';

            try {
                const response = await fetch('/api/plex-sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        plex_username: username,
                        plex_password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.textContent = data.added
                        ? `✓ Added ${data.added} new titles (${data.found} in your library).`
                        : `✓ Already up to date — all ${data.found} titles are in the tracker.`;
                    statusDiv.className = 'status-message success';
                    setTimeout(() => {
                        document.getElementById('plex-username').value = '';
                        document.getElementById('plex-password').value = '';
                    }, 2000);
                } else {
                    statusDiv.textContent = data.error || 'Sync failed';
                    statusDiv.className = 'status-message error';
                }
            } catch (error) {
                // fetch itself failed, so this never reached Plex — saying
                // "check your credentials" here sends people down the wrong path
                statusDiv.textContent = 'Could not reach the tracker itself. Open the app at its railway.app address rather than a local file.';
                statusDiv.className = 'status-message error';
            }

            syncBtn.disabled = false;
        }
    </script>
</body>
</html>
